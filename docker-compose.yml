services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: genz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genz_ai}
      POSTGRES_USER: ${POSTGRES_USER:-genz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genz_secure_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genz_user} -d ${POSTGRES_DB:-genz_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genz-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: genz-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genz_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-genz_minio_password}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
